<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beat-Sync Music Video & Movie Studio</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d27;
    --border: #2c3142;
    --accent: #6c63ff;
    --accent-hover: #574fd6;
    --text: #f1f3f9;
    --muted: #9aa1b2;
  }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header {
    padding: 18px 28px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  header span { color: var(--muted); font-size: 0.9rem; }
  .container {
    display: grid; grid-template-columns: 380px 1fr; gap: 20px;
    padding: 20px; max-width: 1450px; width: 100%; margin: 0 auto; flex: 1;
  }
  @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px;
  }
  .section-title {
    font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--accent); font-weight: 700; margin-top: 4px;
  }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; color: var(--muted); }
  input[type="file"], input[type="text"], input[type="number"], select {
    background: #12141c; border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: 8px; font-size: 0.9rem; width: 100%;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .checkbox-row {
    display: flex; align-items: center; gap: 8px; color: var(--text);
    font-size: 0.9rem; cursor: pointer;
  }
  button {
    background: var(--accent); color: white; border: none; padding: 12px 16px;
    border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer;
    transition: background 0.2s;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: #2c3142; }
  button.secondary:hover:not(:disabled) { background: #3a4056; }
  .preview-area {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
  }
  canvas {
    max-width: 100%; max-height: 68vh; background: #000;
    border-radius: 10px; border: 1px solid var(--border);
    box-shadow: 0 12px 32px rgba(0,0,0,0.45);
  }
  .status-bar {
    width: 100%; background: #12141c; border: 1px solid var(--border);
    padding: 10px 14px; border-radius: 8px; font-size: 0.9rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  progress { width: 100%; height: 8px; border-radius: 4px; }
  a.download-btn {
    display: inline-block; background: #10b981; color: #052e16;
    text-decoration: none; font-weight: 700; padding: 12px 20px;
    border-radius: 8px; text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>🎬 Beat-Sync Music Video & Movie Studio</h1>
  <span>100% Free • Browser-Rendered • Unlimited</span>
</header>

<div class="container">
  <div class="panel">
    <div class="section-title">1. Media & Audio</div>
    <label>Song / Soundtrack (MP3, WAV, OGG)
      <input type="file" id="audioInput" accept="audio/*" />
    </label>
    <label>Images, GIFs, or Video Clips (Select Multiple)
      <input type="file" id="mediaInput" accept="image/*,video/*" multiple />
    </label>

    <div class="section-title">2. Titles, Lyrics & Custom Fonts</div>
    <label>Static Title / Watermark (Optional)
      <input type="text" id="titleText" placeholder="Movie Title or Artist Name..." />
    </label>
    <label>Timed Lyrics / Subtitles (.srt Optional)
      <input type="file" id="srtInput" accept=".srt" />
    </label>
    <label>Custom Font (.ttf, .otf, .woff Optional)
      <input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2" />
    </label>
    <div class="row">
      <label>Font Size (px)
        <input type="number" id="fontSize" value="56" min="18" max="160" />
      </label>
      <label>Text Color
        <input type="color" id="textColor" value="#ffffff" style="height:38px;padding:2px;" />
      </label>
    </div>
    <label>Text Position
      <select id="textPosition">
        <option value="bottom">Bottom</option>
        <option value="center">Center</option>
        <option value="top">Top</option>
      </select>
    </label>

    <div class="section-title">3. Beat-Sync & Visual FX</div>
    <div class="row">
      <label>Beats Per Scene Cut
        <input type="number" id="beatsPerCut" value="4" min="1" max="32" />
      </label>
      <label>Sensitivity (1-10)
        <input type="number" id="beatSensitivity" value="6" min="1" max="10" />
      </label>
    </div>
    <label>Cinema Color Filter
      <select id="filterMode">
        <option value="none">None (Original)</option>
        <option value="grayscale(100%) contrast(125%)">Noir (Black & White)</option>
        <option value="sepia(45%) saturate(130%) contrast(108%)">Warm Vintage</option>
        <option value="hue-rotate(185deg) saturate(115%) contrast(110%)">Cool Cinema</option>
        <option value="contrast(120%) saturate(140%)">Vibrant Pop</option>
      </select>
    </label>
    <label>Output Resolution
      <select id="resolutionSelect">
        <option value="1280x720">720p Landscape (1280×720)</option>
        <option value="1920x1080">1080p Landscape (1920×1080)</option>
        <option value="1080x1920">1080p Shorts/Reels (1080×1920)</option>
      </select>
    </label>

    <label class="checkbox-row">
      <input type="checkbox" id="beatZoom" checked /> Enable Beat-Punch Zoom Effect
    </label>
    <label class="checkbox-row">
      <input type="checkbox" id="showVisualizer" checked /> Enable Audio-Reactive Visualizer
    </label>

    <div class="row">
      <button id="previewBtn" class="secondary">▶ Preview</button>
      <button id="renderBtn">🔴 Render & Export</button>
    </div>
    <button id="stopBtn" class="secondary" style="display:none;">⏹ Stop</button>
  </div>

  <div class="panel preview-area">
    <canvas id="studioCanvas" width="1280" height="720"></canvas>
    <div class="status-bar">
      <span id="statusText">Upload an audio track and images/videos to begin.</span>
      <span id="timeDisplay">00:00 / 00:00</span>
    </div>
    <progress id="progressBar" value="0" max="100"></progress>
    <div id="downloadContainer"></div>
  </div>
</div>

<script>
const canvas = document.getElementById("studioCanvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("statusText");
const timeDisplay = document.getElementById("timeDisplay");
const progressBar = document.getElementById("progressBar");
const downloadContainer = document.getElementById("downloadContainer");

let customFontFamily = "sans-serif";
let isRunning = false;
let stopRequested = false;

// Load Custom Font
document.getElementById("fontInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const buf = await file.arrayBuffer();
  const fontName = "UserCustomFont_" + Date.now();
  const fontFace = new FontFace(fontName, buf);
  await fontFace.load();
  document.fonts.add(fontFace);
  customFontFamily = fontName;
  statusText.textContent = `Loaded custom font: ${file.name}`;
});

// Parse .SRT Subtitles
function parseSRT(srtText) {
  const blocks = srtText.trim().split(/\r?\n\r?\n/);
  const subs = [];
  const timeRegex = /(\d+):(\d+):(\d+)[,.](\d+)\s*-->\s*(\d+):(\d+):(\d+)[,.](\d+)/;
  for (const block of blocks) {
    const lines = block.split(/\r?\n/);
    for (let i = 0; i < lines.length; i++) {
      const m = lines[i].match(timeRegex);
      if (m) {
        const start = +m[1]*3600 + +m[2]*60 + +m[3] + +m[4]/1000;
        const end = +m[5]*3600 + +m[6]*60 + +m[7] + +m[8]/1000;
        const text = lines.slice(i + 1).join(" ").trim();
        if (text) subs.push({ start, end, text });
        break;
      }
    }
  }
  return subs;
}

// Detect Beats from AudioBuffer
function detectBeats(audioBuffer, sensitivity) {
  const data = audioBuffer.getChannelData(0);
  const sampleRate = audioBuffer.sampleRate;
  const windowSize = Math.floor(sampleRate * 0.05); // 50ms windows
  const energies = [];

  for (let i = 0; i < data.length; i += windowSize) {
    let sum = 0;
    for (let j = 0; j < windowSize && i + j < data.length; j++) {
      sum += data[i + j] * data[i + j];
    }
    energies.push(Math.sqrt(sum / windowSize));
  }

  const beats =;
  const thresholdFactor = 1.6 - (sensitivity * 0.05); // 1.1 to 1.55
  const minGapSec = 0.28;

  for (let i = 10; i < energies.length; i++) {
    let localAvg = 0;
    for (let k = i - 10; k < i; k++) localAvg += energies[k];
    localAvg /= 10;

    const timeSec = (i * windowSize) / sampleRate;
    if (energies[i] > localAvg * thresholdFactor && energies[i] > 0.03) {
      if (timeSec - beats[beats.length - 1] >= minGapSec) {
        beats.push(timeSec);
      }
    }
  }
  return beats;
}

// Load Visual Assets (Images & Videos)
async function loadMediaAssets(files) {
  const assets = [];
  for (const file of files) {
    const url = URL.createObjectURL(file);
    if (file.type.startsWith("video/")) {
      const vid = document.createElement("video");
      vid.src = url;
      vid.muted = true;
      vid.loop = true;
      vid.playsInline = true;
      await new Promise((res) => { vid.onloadedmetadata = res; });
      assets.push({ type: "video", el: vid });
    } else {
      const img = new Image();
      img.src = url;
      await new Promise((res) => { img.onload = res; });
Use code with caution.
assets.push({ type: "image", el: img });
}
}
return assets;
}
function formatTime(sec) {
const m = Math.floor(sec / 60).toString().padStart(2, "0");
const s = Math.floor(sec % 60).toString().padStart(2, "0");
return ${m}:${s};
}
async function runStudio(recordMode) {
const audioFile = document.getElementById("audioInput").files[0];
const mediaFiles = document.getElementById("mediaInput").files;
if (!audioFile || mediaFiles.length === 0) {
alert("Please upload both an audio track and at least one image or video clip.");
return;
}
isRunning = true;
stopRequested = false;
downloadContainer.innerHTML = "";
document.getElementById("previewBtn").disabled = true;
document.getElementById("renderBtn").disabled = true;
document.getElementById("stopBtn").style.display = "block";
const [W, H] = document.getElementById("resolutionSelect").value.split("x").map(Number);
canvas.width = W;
canvas.height = H;
statusText.textContent = "Analyzing audio & detecting beats...";
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const arrayBuf = await audioFile.arrayBuffer();
const audioBuffer = await audioCtx.decodeAudioData(arrayBuf);
const totalDuration = audioBuffer.duration;
const sensitivity = Number(document.getElementById("beatSensitivity").value);
const beatsPerCut = Number(document.getElementById("beatsPerCut").value);
const allBeats = detectBeats(audioBuffer, sensitivity);
const cutTimes = allBeats.filter((_, idx) => idx % beatsPerCut === 0);
statusText.textContent = "Loading images & video clips...";
const assets = await loadMediaAssets(mediaFiles);
let subtitles = [];
const srtFile = document.getElementById("srtInput").files[0];
if (srtFile) {
subtitles = parseSRT(await srtFile.text());
}
// Setup Audio Playback + Analyser + Optional MediaRecorder
const source = audioCtx.createBufferSource();
source.buffer = audioBuffer;
const analyser = audioCtx.createAnalyser();
analyser.fftSize = 128;
const freqData = new Uint8Array(analyser.frequencyBinCount);
source.connect(analyser);
analyser.connect(audioCtx.destination);
let recorder = null;
const chunks = [];
if (recordMode) {
const dest = audioCtx.createMediaStreamDestination();
analyser.connect(dest);
const canvasStream = canvas.captureStream(30);
const combinedStream = new MediaStream([
...canvasStream.getVideoTracks(),
...dest.stream.getAudioTracks()
]);
const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
? "video/webm;codecs=vp9,opus"
: "video/webm";
recorder = new MediaRecorder(combinedStream, { mimeType: mime, videoBitsPerSecond: 6000000 });
recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
recorder.onstop = () => {
const blob = new Blob(chunks, { type: mime });
const url = URL.createObjectURL(blob);
downloadContainer.innerHTML = <a class="download-btn" href="${url}" download="music_video.webm">⬇ Download Rendered Video (.webm)</a>;
statusText.textContent = "Render complete! Click the green button below to save.";
};
recorder.start();
}
// Start playing any video clips
assets.forEach((a) => { if (a.type === "video") a.el.play(); });
const startTime = audioCtx.currentTime;
source.start(0);
statusText.textContent = recordMode ? "Rendering video in real time..." : "Previewing live...";
const titleText = document.getElementById("titleText").value.trim();
const fontSize = Number(document.getElementById("fontSize").value);
const textColor = document.getElementById("textColor").value;
const textPos = document.getElementById("textPosition").value;
const filterMode = document.getElementById("filterMode").value;
const beatZoom = document.getElementById("beatZoom").checked;
const showViz = document.getElementById("showVisualizer").checked;
function drawFrame() {
if (stopRequested) {
cleanup();
return;
}
const elapsed = audioCtx.currentTime - startTime;
if (elapsed >= totalDuration) {
cleanup();
return;
}
progressBar.value = (elapsed / totalDuration) * 100;
timeDisplay.textContent = ${formatTime(elapsed)} / ${formatTime(totalDuration)};
// Find active scene index based on beat cuts
let sceneIdx = 0;
for (let i = 0; i < cutTimes.length; i++) {
if (elapsed >= cutTimes[i]) sceneIdx = i;
else break;
}
const timeSinceCut = elapsed - (cutTimes[sceneIdx] || 0);
const asset = assets[sceneIdx % assets.length];
// Draw Background Media with Cover Scaling + Beat Zoom
ctx.save();
ctx.fillStyle = "#000";
ctx.fillRect(0, 0, W, H);
ctx.filter = filterMode;
const mediaW = asset.type === "video" ? asset.el.videoWidth : asset.el.width;
const mediaH = asset.type === "video" ? asset.el.videoHeight : asset.el.height;
const baseScale = Math.max(W / mediaW, H / mediaH);
const pulse = beatZoom ? 1.0 + 0.08 * Math.exp(-6 * timeSinceCut) : 1.0;
const finalScale = baseScale * pulse;
const drawW = mediaW * finalScale;
const drawH = mediaH * finalScale;
ctx.drawImage(asset.el, (W - drawW) / 2, (H - drawH) / 2, drawW, drawH);
ctx.restore();
// Draw Audio-Reactive Visualizer
if (showViz) {
analyser.getByteFrequencyData(freqData);
const bars = 36;
const totalBarWidth = W * 0.6;
const barWidth = totalBarWidth / bars;
const startX = (W - totalBarWidth) / 2;
const baseY = H * 0.94;
ctx.fillStyle = "rgba(255, 255, 255, 0.78)";
for (let b = 0; b < bars; b++) {
const val = freqData[b] / 255;
const barH = Math.max(6, val * (H * 0.16));
ctx.fillRect(startX + b * barWidth + 2, baseY - barH, barWidth - 4, barH);
}
}
// Determine Active Text (SRT Lyric takes priority over static title)
let activeText = titleText;
for (const sub of subtitles) {
if (elapsed >= sub.start && elapsed <= sub.end) {
activeText = sub.text;
break;
}
}
if (activeText) {
ctx.save();
ctx.font = bold ${fontSize}px "${customFontFamily}", sans-serif;
ctx.textAlign = "center";
ctx.textBaseline = "middle";
let y = H * 0.82;
if (textPos === "top") y = H * 0.12;
if (textPos === "center") y = H * 0.5;
// Drop Shadow
ctx.fillStyle = "rgba(0,0,0,0.8)";
ctx.fillText(activeText, W / 2 + 3, y + 3);
ctx.fillStyle = textColor;
ctx.fillText(activeText, W / 2, y);
ctx.restore();
}
requestAnimationFrame(drawFrame);
}
function cleanup() {
isRunning = false;
try { source.stop(); } catch (e) {}
assets.forEach((a) => { if (a.type === "video") a.el.pause(); });
if (recorder && recorder.state !== "inactive") recorder.stop();
document.getElementById("previewBtn").disabled = false;
document.getElementById("renderBtn").disabled = false;
document.getElementById("stopBtn").style.display = "none";
if (!recordMode) statusText.textContent = "Preview finished.";
}
document.getElementById("stopBtn").onclick = () => {
stopRequested = true;
statusText.textContent = "Stopped.";
};
requestAnimationFrame(drawFrame);
}
document.getElementById("previewBtn").addEventListener("click", () => runStudio(false));
document.getElementById("renderBtn").addEventListener("click", () => runStudio(true));
